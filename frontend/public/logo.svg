<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#f97316" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Totem Base -->
  <rect x="35" y="15" width="30" height="75" rx="8" fill="url(#brand)" filter="url(#shadow)" />
  
  <!-- Screen Area -->
  <rect x="40" y="25" width="20" height="35" rx="4" fill="#ffffff" />
  
  <!-- Abstract Price Indicators -->
  <rect x="43" y="32" width="14" height="4" rx="2" fill="#10b981" />
  <rect x="43" y="40" width="14" height="4" rx="2" fill="#f59e0b" />
  <rect x="43" y="48" width="14" height="4" rx="2" fill="#ef4444" />
  
  <!-- Bottom Accent -->
  <circle cx="50" cy="75" r="4" fill="#ffffff" fill-opacity="0.9" />
</svg>
